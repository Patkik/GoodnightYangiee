name: Auto Build & Upload APK to Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Attach to Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Root Web Assets to Android App
        run: |
          # Copy all web assets from root into android-app/app/src/main/assets/
          ASSETS_DIR="android-app/app/src/main/assets"
          cp -f index.html "$ASSETS_DIR/index.html"
          cp -f version.json "$ASSETS_DIR/version.json"
          cp -f manifest.json "$ASSETS_DIR/manifest.json"
          cp -rf css/ "$ASSETS_DIR/css/"
          cp -rf js/ "$ASSETS_DIR/js/"
          # Copy optional web files if they exist
          [ -f landing.html ] && cp -f landing.html "$ASSETS_DIR/landing.html" || true
          [ -f sw.js ] && cp -f sw.js "$ASSETS_DIR/sw.js" || true
          [ -f icon-192.png ] && cp -f icon-192.png "$ASSETS_DIR/icon-192.png" || true
          [ -f icon-512.png ] && cp -f icon-512.png "$ASSETS_DIR/icon-512.png" || true
          [ -f logo.png ] && cp -f logo.png "$ASSETS_DIR/logo.png" || true
          echo "✅ Web assets synced to Android app"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android-app/gradlew

      - name: Build Debug APK
        run: |
          cd android-app
          ./gradlew assembleDebug

      - name: Determine Target Tag Name
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v2.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Target Release Tag: $TAG"

      - name: Upload APK Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Hakdog Sanctuary ${{ steps.get_tag.outputs.tag }}
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
