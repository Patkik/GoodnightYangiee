name: Auto Build & Create GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Web React Assets
        run: |
          cd android-app/react-src
          npm ci
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android-app/gradlew

      - name: Build Debug APK
        run: |
          cd android-app
          ./gradlew assembleDebug

      - name: Create GitHub Release & Upload APK Asset
        uses: softprops/action-gh-release@v1
        with:
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
