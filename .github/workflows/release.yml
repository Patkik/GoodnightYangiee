name: Auto Build & Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build APK & Publish Automated Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Web React Assets
        run: |
          cd android-app/react-src
          npm ci
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android-app/gradlew

      - name: Build Debug APK
        run: |
          cd android-app
          ./gradlew assembleDebug

      - name: Generate Dynamic Version Tag
        id: tag_gen
        run: |
          TAG_NAME="v2.0.${{ github.run_number }}"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "Generated Tag: $TAG_NAME"

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Hakdog Sanctuary ${{ env.TAG_NAME }}
          body: |
            Automated Release for build #${{ github.run_number }}
            
            Commit: `${{ github.sha }}`
            Message: `${{ github.event.head_commit.message }}`
          draft: false
          prerelease: false
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
