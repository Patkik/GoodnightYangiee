name: Package Kiro Web Assets

on:
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-assets:
    name: Package Web Assets (dist.zip)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync Root Assets to Android App
        run: |
          ASSETS_DIR="android-app/app/src/main/assets"
          cp -f index.html "$ASSETS_DIR/index.html"
          cp -f version.json "$ASSETS_DIR/version.json"
          cp -f manifest.json "$ASSETS_DIR/manifest.json"
          cp -rf css/ "$ASSETS_DIR/css/"
          cp -rf js/ "$ASSETS_DIR/js/"
          [ -f landing.html ] && cp -f landing.html "$ASSETS_DIR/landing.html" || true
          [ -f sw.js ] && cp -f sw.js "$ASSETS_DIR/sw.js" || true
          [ -f icon-192.png ] && cp -f icon-192.png "$ASSETS_DIR/icon-192.png" || true
          [ -f icon-512.png ] && cp -f icon-512.png "$ASSETS_DIR/icon-512.png" || true
          [ -f logo.png ] && cp -f logo.png "$ASSETS_DIR/logo.png" || true
          echo "✅ Assets synced"

      - name: Create Web Assets Package (dist.zip)
        run: |
          # Package all web files needed for OTA updates
          zip -r dist.zip \
            index.html \
            version.json \
            manifest.json \
            css/ \
            js/ \
            -x "*.DS_Store" \
            2>/dev/null
          # Add optional files if they exist
          [ -f landing.html ] && zip -u dist.zip landing.html || true
          [ -f sw.js ] && zip -u dist.zip sw.js || true
          [ -f logo.png ] && zip -u dist.zip logo.png || true
          [ -f icon-192.png ] && zip -u dist.zip icon-192.png || true
          [ -f icon-512.png ] && zip -u dist.zip icon-512.png || true
          echo "📦 dist.zip created ($(du -h dist.zip | cut -f1))"

      - name: Upload Zip to Release Assets
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release' || github.ref_type == 'tag'
        with:
          files: dist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
